<!DOCTYPE html>
<html lang="en-ZA"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IOL Cape Town Cycle Tour Ride Guide (300×600)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pg:#eceff3;--bg:#fff;--ink:#111;--mu:#5b6270;--ln:#e1e4ea;--sel:#f3f5f8;--nv:#181e4e;--bl:#0b7a6e;--or:#4fc7b8;--gn:#0b7a6e;--lk:#0b7a6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#000;--bg:#13151c;--ink:#f1f2f5;--mu:#a6acba;--ln:#2d3140;--sel:#1c1f2a;--lk:#5fd3c4;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#000;--bg:#13151c;--ink:#f1f2f5;--mu:#a6acba;--ln:#2d3140;--sel:#1c1f2a;--lk:#5fd3c4;color-scheme:dark}
html{box-sizing:border-box}body{margin:0;background:var(--pg);display:grid;place-items:center;min-height:100vh;padding:16px;font:14px 'Barlow',system-ui,sans-serif}
.cap{font:12px 'Barlow',system-ui,sans-serif;color:var(--mu);margin:8px 0 0;text-align:center;max-width:300px}
/* Widget styles are scoped to #tom so host-page CSS can't leak in */
#tom{all:initial;display:flex;flex-direction:column;position:relative;width:300px;height:600px;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 'Barlow',system-ui,sans-serif;border:1px solid var(--ln);box-sizing:border-box}
#tom *{box-sizing:border-box}
#tom .top{flex:none;background:#fff;color:#111;display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid #e1e4ea}
#tom .top img{height:22px;display:block}#tom .top span{font:700 .78rem 'Barlow Condensed',sans-serif;letter-spacing:.04em;flex:1}
#tom button{font:inherit;color:inherit;cursor:pointer}
#tom .hm{min-height:32px;padding:0 8px;border:1px solid #111;background:#fff;color:#111;font-size:.78rem;font-weight:600;border-radius:2px}
#tom .brand{flex:none;background:var(--nv);height:76px;display:grid;place-items:center;border-bottom:3px solid var(--or);position:relative}#tom .brand img{height:68px;display:block}
#tom .brand::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--or)}
#tom main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;animation:f .2s}@keyframes f{from{opacity:0}}
@media (prefers-reduced-motion:reduce){#tom main{animation:none}}
#tom h1,#tom h2,#tom h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;line-height:1.1;margin:0 0 6px}
#tom h1{font-size:2rem;color:var(--ink)}#tom h2{font-size:1.4rem;padding-left:8px;border-left:4px solid var(--bl)}#tom h3{font-size:1.05rem}
#tom .kick{font:700 .8rem 'Barlow Condensed',sans-serif;letter-spacing:.06em;color:var(--bl);margin-bottom:4px}
#tom p{margin:0 0 8px}#tom .mu{color:var(--mu);font-size:.82rem}
#tom .opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin:0 0 8px;padding:8px 12px;text-align:left;border:1px solid var(--ln);border-left:4px solid var(--bl);background:var(--bg);border-radius:2px;font-weight:600}
#tom .opt:hover{background:var(--sel)}#tom .opt small{display:block;font-weight:400;color:var(--mu)}#tom .opt b{font-size:1.3rem}
#tom .acc{border-top:1px solid var(--ln)}#tom .acc>button{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;font-weight:600;padding:6px 0}
#tom .acc>div{padding:0 0 10px}#tom .dt{display:inline-block;min-width:42px;text-align:center;background:var(--nv);color:#fff;font:700 .8rem/1.1 'Barlow Condensed',sans-serif;padding:3px 4px;margin-right:8px}
#tom dl{margin:0 0 8px}#tom dt{font-weight:600;font-size:.78rem;color:var(--mu)}#tom dd{margin:0 0 6px}
#tom .tbd{background:var(--sel);padding:0 5px;font-style:italic}
#tom a.ln{display:inline-flex;align-items:center;min-height:40px;color:var(--lk);font-weight:600}
#tom .cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;background:var(--bl);color:#fff;text-decoration:none;font-weight:600;border:0;border-radius:2px;margin:6px 0}
#tom .spon{border:1px dashed var(--mu);background:var(--sel);padding:8px 10px;margin:10px 0;font-size:.8rem}#tom .spon button{all:unset;cursor:pointer;display:block;color:var(--lk);font-weight:600;min-height:32px;padding-top:4px}#tom .spon b{color:var(--mu);font-size:.72rem;letter-spacing:.04em}
#tom .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}#tom .chip{min-height:40px;padding:0 10px;border:1px solid var(--ln);background:var(--bg);border-radius:20px;font-size:.82rem}#tom .chip[aria-pressed=true]{background:var(--nv);color:#fff;border-color:var(--nv)}
#tom .it{display:flex;gap:10px;align-items:center;min-height:44px;border-bottom:1px solid var(--ln);cursor:pointer}#tom .it input{width:22px;height:22px;accent-color:var(--gn);flex:none}#tom .it input:checked+span{text-decoration:line-through;color:var(--mu)}
#tom progress{width:100%;height:8px;accent-color:var(--gn)}
#tom ul{margin:4px 0 8px;padding-left:18px}#tom li{margin-bottom:3px}
#tom .tabs{flex:none;display:flex;border-top:1px solid var(--ln);background:var(--bg)}
#tom .tabs button{flex:1;min-height:48px;padding:2px 0;border:0;border-top:3px solid transparent;background:none;color:var(--mu);font-size:.72rem;font-weight:600}#tom .tabs button[aria-current=true]{color:var(--ink);border-top-color:var(--or)}
#tom .back{min-height:36px;border:0;background:none;color:var(--lk);font-weight:600;padding:0;margin-bottom:4px}
#tom :focus-visible{outline:3px solid var(--or);outline-offset:1px}
#tom .note{border-left:3px solid var(--or);background:var(--sel);padding:6px 8px;font-size:.78rem;color:var(--mu);margin:8px 0}
#tom details{border-top:1px solid var(--ln);padding:8px 0;font-size:.8rem}#tom code{font-size:.74rem}
#tom .toast{position:absolute;left:10px;right:10px;bottom:56px;background:#111;color:#fff;padding:9px 12px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s;font-size:.82rem}#tom .toast.on{opacity:1}
#tom .ps{flex:none;font-size:.7rem;color:var(--mu);padding:2px 10px;border-bottom:1px solid var(--ln);background:var(--sel)}#tom .ps b{color:var(--ink)}
#tom .card{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--ln);background:none;padding:8px 0;min-height:44px;color:inherit;text-decoration:none;cursor:pointer}#tom .card:hover h3{color:var(--lk)}
</style></head><body>

const VIEWS={
home(){return `<div class="kick">IOL | CAPE TOWN CYCLE TOUR</div><h1>The Cycle Tour Ride Guide</h1><p style="font-weight:600;margin-bottom:4px">${DATA.tagline}</p><p class="mu">Find event information, prepare for the ride and plan your day. Choose where to start:</p>`+DATA.paths.map(([k,e,t,s])=>`<button class="opt" data-a="who" data-k="${k}"><b aria-hidden="true">${e}</b><span>${t}<small>${s}</small></span></button>`).join('')+`<div class="spon" style="text-align:center"><b>${DATA.leadSponsor.label}</b><br><span style="display:inline-block;margin-top:4px;border:1px dashed var(--mu);padding:8px 28px;color:var(--mu)">${DATA.leadSponsor.name} logo</span></div><details><summary><b>Notes for IOL developers</b></summary><p class="mu">Suggested events. Not connected: see the ANALYTICS object in the code for the GA4 / GTM hook. Until configured, events only log to the console.</p><ul><li><code>widget_loaded</code></li><li><code>pathway_selected</code></li><li><code>riders_guide_opened</code></li><li><code>route_spectator_guide_opened</code></li><li><code>explore_opened</code></li><li><code>event_info_opened</code></li><li><code>checklist_item_completed</code></li><li><code>recommendation_clicked</code></li><li><code>official_link_clicked</code></li><li><code>sponsor_clicked</code></li></ul><p class="mu">All content lives in the DATA object. Information marked “to be confirmed” needs organiser input.</p></details>`},
rider(){const n=DATA.checklist.length,d=S.ck.size;return hd('Rider’s Guide')+`<h3>Your checklist</h3><progress max="${n}" value="${d}" aria-label="Checklist progress"></progress><p class="mu">${d} of ${n} done${d===n?'. Ready to ride!':''}</p>`+DATA.checklist.map((c,i)=>`<label class="it"><input type="checkbox" data-ck="${i}" ${S.ck.has(i)?'checked':''}><span>${c}</span></label>`).join('')+'<div style="height:10px"></div>'+DATA.rider.map((r,i)=>acc('r'+i,r[0],`<p>${tbc(r[1])}</p>`)).join('')+off('rider')+spon(DATA.sponsors.rider)+'<p class="note">General information only. Follow official event rules and your own training or medical guidance.</p>'},
route(){const R=DATA.route,row=(p,k)=>acc(k+p[0],p[0],`<p>${tbc(p[1])}</p>`);return hd('Route and Spectator Guide')+`<h3>Route sections</h3>`+R.sections.map(p=>row(p,'s')).join('')+`<h3 style="margin-top:12px">Spectator viewing areas</h3>`+R.areas.map(p=>row(p,'a')).join('')+'<div style="height:10px"></div>'+R.other.map(p=>row(p,'o')).join('')+`<h3 style="margin-top:12px">Spectator tips</h3><ul>${R.tips.map(t=>`<li>${t}</li>`).join('')}</ul>`+off('route')+spon(DATA.sponsors.route)},
explore(){const c=DATA.explore[S.cat];return hd('Explore Cape Town')+'<div class="chips" role="group" aria-label="Category">'+Object.entries(DATA.explore).map(([k,x])=>`<button class="chip" aria-pressed="${k===S.cat}" data-a="cat" data-id="${k}">${x.l}</button>`).join('')+'</div><p class="note" style="margin-top:0">Illustrative suggestions, not confirmed event partners.</p>'+c.i.map((i,n)=>{const b=`<h3 style="margin:0">${i[0]}</h3><p class="mu" style="margin:0">${i[1]}</p><span class="ln">${i[2]?'Visit website ↗':'Link placeholder'}</span>`;return i[2]?`<a class="card" href="${i[2]}" target="_blank" rel="noopener noreferrer" data-a="rec" data-k="${i[0]}">${b}</a>`:`<button class="card" data-a="rec" data-k="${i[0]}" data-ph="1">${b}</button>`}).join('')+(c.s?spon(c.s):'')},
info(){return hd('Event Information')+DATA.info.map((r,i)=>acc('i'+i,r[0],`<p>${tbc(r[1])}</p>`)).join('')+'<div style="height:8px"></div>'+`<a class="cta" href="${OFFICIAL}" target="_blank" rel="noopener noreferrer" data-a="ext" data-k="info">Official event website ↗</a><p class="mu">This widget is a companion to the official website, not a replacement.</p>`+spon(DATA.sponsors.info)}};
const EVT={rider:'riders_guide_opened',route:'route_spectator_guide_opened',explore:'explore_opened',info:'event_info_opened'};
function render(keep){const st=v.scrollTop;v.innerHTML=VIEWS[S.v]();v.scrollTop=keep?st:0;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.v))}
function go(x){if(x===S.v)return;S.hist.push(S.v);S.v=x;if(EVT[x])track(EVT[x]);render()}
// ---------- Actions ----------
document.addEventListener('click',e=>{const el=e.target.closest('#tom [data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
if(a==='go'){if(el.dataset.v==='home')S.hist=[];go(el.dataset.v)}
else if(a==='back'){S.v=S.hist.pop()||'home';render()}
else if(a==='who'){S.who=el.dataset.k;track('pathway_selected',{pathway:S.who});S.cat={rider:'cycle',support:'eat',visit:'stay'}[S.who];go(DATA.paths.find(p=>p[0]===S.who)[4])}
else if(a==='acc'){S.open[id]=!S.open[id];render(true)}
else if(a==='cat'){S.cat=id;render(true)}
else if(a==='rec'){track('recommendation_clicked',{item:el.dataset.k});if(el.dataset.ph)toast('External link placeholder. A real destination will open here.')}
else if(a==='ext')track('official_link_clicked',{where:el.dataset.k})
else if(a==='spon'){track('sponsor_clicked',{slot:el.dataset.k});toast('Sponsor placeholder. A partner link would open here.')}});
document.addEventListener('change',e=>{const i=e.target.dataset.ck;if(i===undefined)return;const n=+i;if(e.target.checked){S.ck.add(n);track('checklist_item_completed',{item:DATA.checklist[n]})}else S.ck.delete(n);render(true);const b=document.querySelector(`[data-ck="${n}"]`);b&&b.focus()});
track('widget_loaded');render();
</script></body></html>
